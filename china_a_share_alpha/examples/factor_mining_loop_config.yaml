# Continuous factor-mining loop configuration.
#
# One iteration:
# 1. Seed enhanced evolution with the current live library (if any).
# 2. Merge the new leaderboard with the live library.
# 3. Clean on train/val/test; keep dense, sign-consistent factors.
# 4. Combine top-N + high_zscore_20 with equal weight and EMA smoothing.
# 5. Promote only if the realistic hold metric improves under one contract.

evolution_config: "china_a_share_alpha/examples/factor_mining_loop_evolution_config.yaml"
data_config: "china_a_share_alpha/examples/enhanced_loop_config_val_frozen.yaml"

seed_base: 1000

# Cleaning thresholds (loose so a small first library survives)
min_train_ic: 0.001
min_val_ic: 0.0
min_val_sharpe: 0.0
min_test_ic: 0.001
min_test_sharpe: 0.0
max_turnover: 0.6
max_nan_frac: 0.5
min_daily_coverage: 0.5

# Semantic deduplication: drop expressions whose absolute Spearman correlation
# on the training set exceeds this threshold.
semantic_dedup_corr_threshold: 0.95

# Combination
top_n: 10
weight_method: "equal"
smooth_span: 10
sort_by: "val_ic"

# Promotion gates
promote_sharpe_threshold: 0.03
promote_return_threshold: 0.005

# Hard gates: a new library must pass ALL of these before it can be promoted,
# even if the Sharpe / return thresholds above are met.
min_train_sharpe_gate: 0.0      # train Sharpe must be positive
min_cleaned_gate: 5             # at least this many factors must survive cleaning
max_selection_correlation_gate: 0.7  # max abs pairwise corr among selected factors

# Realistic hold-Sharpe gate (NEW).  When enabled, the loop computes a
# non-overlapping H-day hold backtest on the test fold and requires both the
# absolute gate and an improvement over the previous best hold Sharpe before
# promoting a new live library.  This prevents overfitting to the loop's
# internal daily-rebalanced, overlapping-forward-return metric.
use_hold_sharpe_gate: true
hold_horizon: 5                 # days between rebalances
hold_transaction_cost: 0.001    # 10 bps one-way
min_hold_sharpe_gate: 1.0       # new library must have hold Sharpe >= 1.0
promote_hold_sharpe_threshold: 0.03  # must improve best hold Sharpe by >= 0.03
promotion_evaluation_mode: "dynamic_trim"
min_factor_coverage: 0.5
# Dynamic trim: cut long positions if their cross-sectional rank deteriorates
# during the holding window. The no-lookahead frozen audit selects it for 5d.
use_dynamic_trim_hold: true

# D2 AST originality / complexity gates (AlphaAgent-inspired)
ast_regularizer_enabled: true
ast_similarity_tau: 0.85
ast_max_depth: 6
ast_max_nodes: 40

# D1 pool-IC diagnostics (AlphaGen-inspired; hold gate still decides promotion)
report_pool_ic: true

# True RSI = Recursive Self-Improvement via loop/recursive_self_improve.py
# (Darwin Gödel Machine / HyperAgents style policy archive). Do NOT add
# Relative Strength Index seed CSVs here.
