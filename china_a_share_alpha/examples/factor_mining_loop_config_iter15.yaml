# Continuous factor-mining loop configuration — Iteration 15: money-flow data fusion.
#
# One iteration:
# 1. Seed enhanced evolution with the current live library + a money-flow seed
#    library that uses newly added buy/sell amount fields.
# 2. Merge the new leaderboard with the live library.
# 3. Clean on train/val/test; keep dense, sign-consistent factors.
# 4. Combine top-N + high_zscore_20 with equal weight and EMA smoothing.
# 5. Promote to live library only if test Sharpe or cost-adj return improves.

evolution_config: "china_a_share_alpha/examples/factor_mining_loop_evolution_config_iter15_5d.yaml"
data_config: "china_a_share_alpha/examples/enhanced_loop_config_iter15_val.yaml"

seed_base: 1015

# Extra seed libraries merged with the live library before evolution.
extra_seed_libraries:
  - "china_a_share_alpha_output/factor_mining_loop/moneyflow_seed_library.csv"

# Cleaning thresholds
min_train_ic: 0.001
min_val_ic: 0.0
min_val_sharpe: 0.0
min_test_ic: 0.001
min_test_sharpe: 0.0
max_turnover: 0.6
max_nan_frac: 0.5
min_daily_coverage: 0.5

# Semantic deduplication
semantic_dedup_corr_threshold: 0.95

# Combination
top_n: 10
weight_method: "equal"
smooth_span: 10
sort_by: "auto"
max_pairwise_corr: 0.4

# Promotion gates
promote_sharpe_threshold: 0.03
promote_return_threshold: 0.005

# Hard gates
min_train_sharpe_gate: 0.0
min_cleaned_gate: 5
max_selection_correlation_gate: 0.7
