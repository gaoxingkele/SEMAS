# Ablation A2 — disable AST originality/complexity gates.
# Same as production loop config except ast_regularizer_enabled: false.

evolution_config: "china_a_share_alpha/examples/factor_mining_loop_evolution_config.yaml"
data_config: "china_a_share_alpha/examples/enhanced_loop_config_val_frozen.yaml"

seed_base: 2000

min_train_ic: 0.001
min_val_ic: 0.0
min_val_sharpe: 0.0
min_test_ic: 0.001
min_test_sharpe: 0.0
max_turnover: 0.6
max_nan_frac: 0.5
min_daily_coverage: 0.5
semantic_dedup_corr_threshold: 0.95

top_n: 10
weight_method: "equal"
smooth_span: 10
sort_by: "val_ic"

promote_sharpe_threshold: 0.03
promote_return_threshold: 0.005
min_train_sharpe_gate: 0.0
min_cleaned_gate: 5
max_selection_correlation_gate: 0.7

use_hold_sharpe_gate: true
hold_horizon: 5
hold_transaction_cost: 0.001
min_hold_sharpe_gate: 1.0
promote_hold_sharpe_threshold: 0.03
promotion_evaluation_mode: "dynamic_trim"
min_factor_coverage: 0.5
use_dynamic_trim_hold: true

ast_regularizer_enabled: false
ast_similarity_tau: 0.85
ast_max_depth: 6
ast_max_nodes: 40
report_pool_ic: true

extra_seed_libraries:
  - "china_a_share_alpha/examples/rsi_modern_seed_library.csv"

# Research-only: do not auto-overwrite production live library.
promotion_enabled: false
