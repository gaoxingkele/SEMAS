# Iteration 10 — Greedy correlation-aware selection in combination.

evolution_config: "china_a_share_alpha/examples/factor_mining_loop_evolution_config_iter8.yaml"
data_config: "china_a_share_alpha/examples/enhanced_loop_config_val.yaml"

seed_base: 1000

# Cleaning thresholds
min_train_ic: 0.001
min_val_ic: 0.0
min_val_sharpe: 0.0
min_test_ic: 0.001
min_test_sharpe: 0.0
max_turnover: 0.6
max_nan_frac: 0.5
min_daily_coverage: 0.50

# Semantic deduplication
semantic_dedup_corr_threshold: 0.80

# Combination
top_n: 10
weight_method: "equal"
smooth_span: 10
sort_by: "val_ic"

# Greedy correlation-aware selection: skip candidate if max abs corr with
# already-selected factors exceeds this threshold.
max_pairwise_corr: 0.40

# Promotion gates
promote_sharpe_threshold: 0.03
promote_return_threshold: 0.005
min_train_sharpe_gate: 0.0
min_cleaned_gate: 5
max_selection_correlation_gate: 0.50
