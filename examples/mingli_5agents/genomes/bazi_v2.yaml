  skill_bindings:
    orchestration: parallel_primary_evidence_then_auxiliary_review_then_synthesis
    primary:
      - mingli-bazi-yuanhai-ziping
      - mingli-bazi-ziping-zhenquan
      - mingli-bazi-sanming-tonghui
      - mingli-bazi-ditiansui
      - mingli-bazi-qiongtong-baojian
      - mingli-bazi-shenfeng-tongkao
      - mingli-bazi-hengmen
    auxiliary:
      - mingli-jicheng
    side_validation:
      - mingli-xingping-huihai
    output_contract:
      required_sections:
        - primary_school_votes
        - supporting_evidence
        - opposing_evidence
        - preserved_conflicts
        - confidence
        - source_receipts
      require_exact_calendar: true
      preserve_conflicts: true
      forbid_single_school_lock: true
    fallback: >-
      If the installed skill registry audit fails, retain deterministic structured
      analysis, mark the skill binding as degraded, and do not promote skill-backed claims.
